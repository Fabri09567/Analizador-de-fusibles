<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel EDET - Diagnóstico OMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería para leer archivos Excel directamente en el navegador -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    body {
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    /* --- BASE DE DATOS EN MEMORIA --- */
    let SETS_DATA = {};
    
    const API_URL = "https://ticse.edetsa.com/Ags/rest/services/AGOL/AGOL_OMS_PRO/MapServer/4/query?f=json&cacheHint=false&resultOffset=0&resultRecordCount=7500&where=1%3D1&orderByFields=&outFields=*&returnGeometry=true&outSR=4326&spatialRel=esriSpatialRelIntersects";

    const ADMINISTRACIONES = [
      { nombre: "TODAS", etiqueta: "Todas" },
      { nombre: "CONCEPCION", etiqueta: "Concepción" },
      { nombre: "METROPOLITANA", etiqueta: "Metropolitana" },
      { nombre: "BANDA DEL RIO SALI", etiqueta: "Banda del Río Salí" },
      { nombre: "TAFI VIEJO", etiqueta: "Tafí Viejo" },
      { nombre: "MONTEROS", etiqueta: "Monteros" },
    ];

    const SUCURSALES = [
      { sucursal: "AGUILARES", administracion: "CONCEPCION", codigo: "AGU" },
      { sucursal: "AMAICHA DEL VALLE", administracion: "MONTEROS", codigo: "ADV" },
      { sucursal: "BANDA DEL RIO SALI", administracion: "BANDA DEL RIO SALI", codigo: "BRS" },
      { sucursal: "BELLA VISTA", administracion: "MONTEROS", codigo: "BV" },
      { sucursal: "BURRUYACU", administracion: "BANDA DEL RIO SALI", codigo: "BUR" },
      { sucursal: "COLALAO DEL VALLE", administracion: "MONTEROS", codigo: "COL" },
      { sucursal: "CONCEPCION", administracion: "CONCEPCION", codigo: "CON" },
      { sucursal: "FAMAILLA", administracion: "MONTEROS", codigo: "FAM" },
      { sucursal: "J.B. ALBERDI", administracion: "CONCEPCION", codigo: "ALB" },
      { sucursal: "LA COCHA", administracion: "CONCEPCION", codigo: "LCH" },
      { sucursal: "LAMADRID", administracion: "CONCEPCION", codigo: "LAM" },
      { sucursal: "LAS CEJAS", administracion: "BANDA DEL RIO SALI", codigo: "LCE" },
      { sucursal: "LOS RALOS", administracion: "BANDA DEL RIO SALI", codigo: "LRA" },
      { sucursal: "LULES", administracion: "MONTEROS", codigo: "LUL" },
      { sucursal: "METROPOLITANA", administracion: "METROPOLITANA", codigo: "METRO" },
      { sucursal: "MONTEROS", administracion: "MONTEROS", codigo: "MON" },
      { sucursal: "SAN PEDRO DE COLALAO", administracion: "TAFI VIEJO", codigo: "SP" },
      { sucursal: "SIMOCA", administracion: "MONTEROS", codigo: "SIM" },
      { sucursal: "STA. ROSA DE LEALES", administracion: "BANDA DEL RIO SALI", codigo: "SRL" },
      { sucursal: "TACO RALO", administracion: "CONCEPCION", codigo: "TR" },
      { sucursal: "TAFI DEL VALLE", administracion: "MONTEROS", codigo: "TDV" },
      { sucursal: "TAFI VIEJO", administracion: "TAFI VIEJO", codigo: "TV" },
      { sucursal: "TRANCAS", administracion: "TAFI VIEJO", codigo: "TRA" },
      { sucursal: "YERBA BUENA", administracion: "TAFI VIEJO", codigo: "YB" },
    ];

    /* --- LÓGICA DE FUSIBLES --- */
    const FUSIBLES_REF = {
      "AEREO_13200": { 2:10, 5:10, 10:16, 16:25, 25:25, 30:36, 40:36, 50:63, 63:80, 75:80, 100:80, 160:125, 200:160, 250:160, 315:200, 400:200, 500:200, 630:200 },
      "AEREO_33000": { 5:10, 10:16, 16:25, 25:36, 30:50, 40:50, 50:50, 63:80, 75:80, 80:80, 100:80, 160:125, 200:160, 250:160, 315:200, 630:200 },
      "MONO_13200": { 1:10, 2:10, 3:16, 5:25, 10:25, 16:63, 25:63, 40:80, 50:100, 63:160, 75:200 },
      "MONO_33000": { 2:10, 5:25, 10:50, 16:50, 25:50, 40:80, 50:100, 63:160, 75:200 },
      "SUBT_13200": { 200:315, 250:250, 315:250, 500:315, 630:315, 800:315, 1000:315 } 
    };

    function obtenerFusibleIdeal(potencia, tipoTrafo, voltaje) {
      if (!tipoTrafo) return null;
      let tipoNorm = tipoTrafo.toUpperCase();
      let key = "";
      
      if (tipoNorm.includes("MONO")) key = "MONO_" + voltaje;
      else if (tipoNorm.includes("SUBTERRANEA") || tipoNorm.includes("SUBTERRANEO")) key = "SUBT_13200"; 
      else key = "AEREO_" + (voltaje == 33000 ? "33000" : "13200"); 

      let tabla = FUSIBLES_REF[key];
      return tabla ? (tabla[potencia] || null) : null;
    }

    function extraerDatosIncidente(observacion, idRaw) {
      const obsNorm = normalizarTexto(observacion);
      const matchSet = obsNorm.match(/(?:SET|S\.E\.T\.|S E T)\s*#?\s*(\d{1,5})/i);
      let setEncontrada = matchSet ? matchSet[1] : null;

      if (!setEncontrada && idRaw && idRaw.match(/^\d+$/)) {
         setEncontrada = idRaw;
      }

      let fusibleColocado = null;
      if (obsNorm.includes("FUSIBLE") || obsNorm.includes("FUS") || obsNorm.includes("NH") || obsNorm.includes("QUEMO") || obsNorm.includes("CAMBIO")) {
         const matchFus = obsNorm.match(/(?:FUSIBLE|FUS|NH|COLOCA).*?(?:DE\s*)?(\d{1,4})\s*(?:A|AMP|AMPERES|AMPER)/i);
         if (matchFus) fusibleColocado = parseInt(matchFus[1]);
      }

      return { nroSet: setEncontrada, fusibleColocado: fusibleColocado };
    }

    function evaluarFusible(colocado, ideal) {
      if (!ideal) return { msg: "SET sin ref.", cls: "bg-slate-100 text-slate-600" };
      if (colocado === ideal) return { msg: "Fusible correcto", cls: "bg-emerald-100 text-emerald-800 border-emerald-300" };
      if (colocado < ideal) return { msg: "Fusible de menor valor", cls: "bg-amber-100 text-amber-800 border-amber-300" };
      if (colocado > ideal) return { msg: "Fusible de mayor valor", cls: "bg-red-100 text-red-800 border-red-300 font-bold" };
    }

    /* --- VARIABLES GLOBALES --- */
    let incidentes = [];
    let incidenteAbierto = null;
    let cargando = false;
    let errorConsulta = "";
    let estadoExcel = "Cargando Excel...";
    let ultimaActualizacion = "Sin actualizar";
    let administracionSeleccionada = "TODAS";
    let sucursalSeleccionada = "TODAS";

    function normalizarTexto(valor) {
      return String(valor || "").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function normalizarAdministracion(valor) {
      const admin = normalizarTexto(valor);
      if (admin.includes("CONCEPC")) return "CONCEPCION";
      if (admin.includes("METROP")) return "METROPOLITANA";
      if (admin.includes("BANDA") || admin.includes("RIO SALI")) return "BANDA DEL RIO SALI";
      if (admin.includes("TAFI")) return "TAFI VIEJO";
      if (admin.includes("MONTER")) return "MONTEROS";
      return admin || "Sin administración";
    }

    function normalizarSucursal(valor) {
      const sucursal = normalizarTexto(valor);
      if (sucursal.includes("AGUIL")) return "AGUILARES";
      if (sucursal.includes("AMAICHA")) return "AMAICHA DEL VALLE";
      if (sucursal.includes("BANDA") || sucursal.includes("RIO SALI")) return "BANDA DEL RIO SALI";
      if (sucursal.includes("BELLA")) return "BELLA VISTA";
      if (sucursal.includes("BURRUYACU")) return "BURRUYACU";
      if (sucursal.includes("COLALAO") && sucursal.includes("VALLE")) return "COLALAO DEL VALLE";
      if (sucursal.includes("CONCEPC")) return "CONCEPCION";
      if (sucursal.includes("FAMAIL")) return "FAMAILLA";
      if (sucursal.includes("J.B") || sucursal.includes("ALBERDI")) return "J.B. ALBERDI";
      if (sucursal.includes("COCHA")) return "LA COCHA";
      if (sucursal.includes("LAMADRID")) return "LAMADRID";
      if (sucursal.includes("CEJAS")) return "LAS CEJAS";
      if (sucursal.includes("RALOS")) return "LOS RALOS";
      if (sucursal.includes("LULES")) return "LULES";
      if (sucursal.includes("METROP")) return "METROPOLITANA";
      if (sucursal.includes("MONTER")) return "MONTEROS";
      if (sucursal.includes("SAN PEDRO")) return "SAN PEDRO DE COLALAO";
      if (sucursal.includes("SIMOCA")) return "SIMOCA";
      if (sucursal.includes("ROSA") || sucursal.includes("LEALES")) return "STA. ROSA DE LEALES";
      if (sucursal.includes("TACO RALO")) return "TACO RALO";
      if (sucursal.includes("TAFI DEL VALLE")) return "TAFI DEL VALLE";
      if (sucursal.includes("TAFI VIEJO")) return "TAFI VIEJO";
      if (sucursal.includes("TRANCAS")) return "TRANCAS";
      if (sucursal.includes("YERBA")) return "YERBA BUENA";
      return sucursal || "SIN SUCURSAL";
    }

    function codigoSucursal(nombreSucursal) {
      const normalizada = normalizarSucursal(nombreSucursal);
      const encontrada = SUCURSALES.find(s => s.sucursal === normalizada);
      return encontrada ? encontrada.codigo : normalizada.substring(0, 4);
    }

    function barraColorPorEstado(estado) {
      const e = normalizarTexto(estado);
      if (e.includes("ASIGN")) return "bg-emerald-500";
      if (e.includes("CREADO") || e.includes("NUEVO")) return "bg-red-500";
      return "bg-amber-500";
    }

    function badgeColorPorEstado(estado) {
      const e = normalizarTexto(estado);
      if (e.includes("ASIGN")) return "bg-emerald-100 text-emerald-700 border-emerald-200";
      if (e.includes("CREADO") || e.includes("NUEVO")) return "bg-red-100 text-red-700 border-red-200";
      return "bg-amber-100 text-amber-700 border-amber-200";
    }

    function formatearHoraActual() {
      return new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function leerCampo(a, nombres, defecto = "") {
      for (const nombre of nombres) {
        if (a[nombre] !== undefined && a[nombre] !== null && a[nombre] !== "") {
          return a[nombre];
        }
      }
      return defecto;
    }

    /* --- CARGA DEL EXCEL DESDE GITHUB --- */
    async function cargarBaseExcel() {
      try {
        // Busca el archivo Excel en la misma carpeta del repositorio
        const response = await fetch("Base de Subestaciones.xlsx");
        if (!response.ok) throw new Error("Archivo no encontrado en el servidor");
        
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: "array" });
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        
        // Convertimos a JSON
        const jsonDatos = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
        
        let conteo = 0;
        jsonDatos.forEach(row => {
          const nroSet = String(row['Nro SET']).trim();
          if (nroSet && nroSet !== "") {
            SETS_DATA[nroSet] = {
              P: parseInt(row['Potencia']) || 0,
              V: parseInt(row['Voltaje Nominal']) || 0,
              T: String(row['Tipo Transformador']).trim(),
              C: parseInt(row['Cant Servicios']) || 0
            };
            conteo++;
          }
        });
        
        estadoExcel = `Excel cargado ✓ (${conteo} SETs)`;
        console.log(estadoExcel);
        
        // Una vez cargado el Excel, arrancamos la consulta a la API de incidentes
        consultarDatos();
        setInterval(() => consultarDatos(), 30000);
      } catch (error) {
        console.error("Error leyendo Excel:", error);
        estadoExcel = "Error: No se encontró 'Base de Subestaciones.xlsx'";
        errorConsulta = "Falta el archivo Excel. Asegurate de subirlo a GitHub junto a este HTML.";
        render();
      }
    }

    function consultarDatos() {
      if (cargando) return;
      cargando = true;
      errorConsulta = "";
      render();

      const callbackName = "edetCallback_" + Date.now();
      const script = document.createElement("script");
      const separador = API_URL.includes("?") ? "&" : "?";

      const timeout = setTimeout(() => {
        limpiar();
        cargando = false;
        errorConsulta = "La consulta no respondió. Probá actualizar de nuevo.";
        render();
      }, 15000);

      function limpiar() {
        clearTimeout(timeout);
        try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[callbackName] = function(data) {
        try {
          const features = Array.isArray(data.features) ? data.features : [];
          incidentes = features.map((f, index) => {
            const a = f.attributes || {};
            const adminOriginal = leerCampo(a, ["ADMINSITRACION", "ADMINISTRACION", "ADMINISTRATION"], "");
            const sucursalOriginal = leerCampo(a, ["SUCURSAL", "Substation", "SUBSTATION", "SET"], "");
            const obs = leerCampo(a, ["OBSERVACION_DESPACHANTE", "OBSERVACION", "COMMENTS", "DESCRIPCION", "DESCRIPTION"], "Sin detalle");
            
            const rawSetData = leerCampo(a, ["Substation", "SUBSTATION", "SET", "SUCURSAL"], "");
            const { nroSet, fusibleColocado } = extraerDatosIncidente(obs, rawSetData);
            
            let dataSet = nroSet && SETS_DATA[nroSet] ? SETS_DATA[nroSet] : null;
            let fusibleIdeal = dataSet ? obtenerFusibleIdeal(dataSet.P, dataSet.T, dataSet.V) : null;
            let evalFusible = fusibleColocado ? evaluarFusible(fusibleColocado, fusibleIdeal) : null;

            return {
              id: a.ID || a.INCIDENT_ID || a.INCIDENTID || a.TICKET_ID || a.OBJECTID || index + 1,
              usuarios: Number(leerCampo(a, ["CUSTOMER_COUNT", "USUARIOS", "CLIENTES", "CANT_USUARIOS"], 0)),
              estado: leerCampo(a, ["STATUS", "ESTADO", "ESTADO_INCIDENTE", "INCIDENT_STATUS"], "Sin estado"),
              administracion: normalizarAdministracion(adminOriginal),
              administracionOriginal: adminOriginal || "Sin administración",
              sucursal: normalizarSucursal(sucursalOriginal),
              observacion: obs,
              lat: f.geometry?.y || null,
              lng: f.geometry?.x || null,
              raw: a,
              nroSet: nroSet,
              potenciaSet: dataSet ? dataSet.P : null,
              clientesSet: dataSet ? dataSet.C : 0, 
              fusibleColocado: fusibleColocado,
              fusibleIdeal: fusibleIdeal,
              evalFusible: evalFusible
            };
          });

          ultimaActualizacion = formatearHoraActual();
          if (features.length === 0) errorConsulta = "La consulta respondió, pero no trajo incidentes activos.";
        } catch (e) {
          errorConsulta = "Error procesando la respuesta: " + e.message;
        } finally {
          cargando = false;
          limpiar();
          render();
        }
      };

      script.onerror = function() {
        cargando = false;
        limpiar();
        errorConsulta = "No se pudo conectar con la consulta de EDET.";
        render();
      };

      script.src = API_URL + separador + "callback=" + encodeURIComponent(callbackName) + "&_ts=" + Date.now();
      document.body.appendChild(script);
    }

    function sucursalesDisponibles() {
      if (administracionSeleccionada === "TODAS") return SUCURSALES;
      return SUCURSALES.filter(s => s.administracion === administracionSeleccionada);
    }

    function incidentesFiltrados() {
      let lista = administracionSeleccionada === "TODAS" ? incidentes : incidentes.filter(i => i.administracion === administracionSeleccionada);
      if (sucursalSeleccionada !== "TODAS") lista = lista.filter(i => i.sucursal === sucursalSeleccionada);
      return [...lista].sort((a, b) => b.usuarios - a.usuarios);
    }

    function cambiarAdministracion(valor) {
      administracionSeleccionada = valor;
      sucursalSeleccionada = "TODAS";
      incidenteAbierto = null;
      render();
    }

    function cambiarSucursal(valor) {
      sucursalSeleccionada = valor;
      incidenteAbierto = null;
      render();
    }

    function render() {
      const vista = incidentesFiltrados();
      const totalUsuarios = vista.reduce((acc, i) => acc + i.usuarios, 0);
      const adminEtiqueta = ADMINISTRACIONES.find(a => a.nombre === administracionSeleccionada)?.etiqueta || administracionSeleccionada;
      const sucursalesFiltro = sucursalesDisponibles();

      const fusiblesCambiados = vista.filter(i => i.fusibleColocado !== null);
      
      const setCounters = {};
      vista.forEach(i => {
         if (i.nroSet) {
             if (!setCounters[i.nroSet]) setCounters[i.nroSet] = { count: 0, clientesRiesgo: i.clientesSet, ids: [] };
             setCounters[i.nroSet].count += 1;
             setCounters[i.nroSet].ids.push(i.id);
         }
      });
      const topSets = Object.entries(setCounters).sort((a, b) => b[1].count - a[1].count).slice(0,10); 

      document.getElementById("app").innerHTML = `
        <div class="max-w-[1400px] mx-auto p-4 flex flex-col lg:flex-row gap-6">
          
          <div class="lg:w-7/12 xl:w-2/3 space-y-4">
            
            <div class="bg-slate-950 text-white rounded-3xl p-5 shadow-xl">
              <div class="flex justify-between items-start gap-3">
                <div>
                  <p class="text-yellow-300 text-sm font-semibold">⚡ EDET / OMS</p>
                  <h1 class="text-2xl font-bold mt-1">Incidentes Activos</h1>
                  <p class="text-slate-400 text-sm">${adminEtiqueta}</p>
                </div>
                <div class="text-right">
                  <p class="text-xs text-slate-400 mb-2">${estadoExcel}</p>
                  <button onclick="consultarDatos()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-2xl text-sm disabled:opacity-50" ${cargando ? "disabled" : ""}>
                    ${cargando ? "Actualizando..." : "Actualizar"}
                  </button>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4 mt-5">
                <div>
                  <label class="text-xs text-slate-300 block mb-1">Administración</label>
                  <select onchange="cambiarAdministracion(this.value)" class="w-full rounded-2xl bg-white/10 border border-white/10 text-white px-3 py-3 outline-none">
                    ${ADMINISTRACIONES.map(a => `<option value="${a.nombre}" ${administracionSeleccionada === a.nombre ? "selected" : ""} class="text-slate-900">${a.etiqueta}</option>`).join("")}
                  </select>
                </div>
                <div>
                  <label class="text-xs text-slate-300 block mb-1">Sucursal</label>
                  <select onchange="cambiarSucursal(this.value)" class="w-full rounded-2xl bg-white/10 border border-white/10 text-white px-3 py-3 outline-none">
                    <option value="TODAS" ${sucursalSeleccionada === "TODAS" ? "selected" : ""} class="text-slate-900">Todas</option>
                    ${sucursalesFiltro.map(s => `<option value="${s.sucursal}" ${sucursalSeleccionada === s.sucursal ? "selected" : ""} class="text-slate-900">${s.codigo} - ${s.sucursal}</option>`).join("")}
                  </select>
                </div>
              </div>

              <div class="flex gap-4 mt-5">
                <div class="bg-white/10 rounded-2xl px-4 py-2">
                  <span class="text-xs text-slate-300">Total Incidentes</span>
                  <span class="text-xl font-bold ml-2">${vista.length}</span>
                </div>
                <div class="bg-white/10 rounded-2xl px-4 py-2">
                  <span class="text-xs text-slate-300">Total Usuarios</span>
                  <span class="text-xl font-bold ml-2 text-red-400">${totalUsuarios}</span>
                </div>
              </div>
              <p class="text-xs text-slate-500 mt-4">Última actualización: ${ultimaActualizacion}</p>
            </div>

            ${errorConsulta ? `<div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-3xl p-4 text-sm">⚠️ ${errorConsulta}</div>` : ""}

            <div class="space-y-4 max-h-[800px] overflow-y-auto pr-2 pb-10">
              ${vista.map(i => `
                <div onclick="toggleDetalle('${i.id}')" class="bg-white rounded-3xl overflow-hidden shadow border border-slate-200 cursor-pointer hover:shadow-md transition">
                  <div class="h-2 ${barraColorPorEstado(i.estado)}"></div>
                  <div class="p-4">
                    <div class="flex justify-between items-start">
                      <div>
                        <h2 class="font-bold text-slate-900 text-lg">Incidente #${i.id}</h2>
                        <p class="text-sm text-slate-500">${i.sucursal} (${codigoSucursal(i.sucursal)})</p>
                      </div>
                      <span class="text-xs font-bold border rounded-full px-3 py-1 ${badgeColorPorEstado(i.estado)}">${i.estado}</span>
                    </div>

                    <div class="flex items-center gap-2 mt-3">
                      <span class="text-2xl">👥</span>
                      <span class="text-2xl font-bold text-slate-900">${i.usuarios}</span>
                      <span class="text-sm text-slate-500">afectados</span>
                    </div>

                    <div class="mt-3 bg-slate-50 rounded-2xl p-3 text-sm text-slate-700 border border-slate-100">
                      ${i.observacion}
                    </div>

                    ${incidenteAbierto === String(i.id) ? `
                      <div class="mt-4 border-t pt-4 text-sm space-y-1 text-slate-600">
                        <p><b>SET Extraída:</b> ${i.nroSet || 'No detectada'}</p>
                        <p><b>Administración Original:</b> ${i.administracionOriginal}</p>
                        ${i.lat ? `<a href="https://www.google.com/maps?q=${i.lat},${i.lng}" target="_blank" onclick="event.stopPropagation()" class="inline-block bg-blue-600 text-white rounded-lg px-4 py-2 font-semibold mt-2 text-xs">Ver en Mapa</a>` : ''}
                      </div>
                    ` : ''}
                  </div>
                </div>
              `).join("")}
            </div>
          </div>

          <div class="lg:w-5/12 xl:w-1/3 space-y-6">
            
            <div class="bg-white rounded-3xl p-5 shadow border border-slate-200">
              <h2 class="font-bold text-slate-900 text-lg mb-4 flex items-center gap-2">
                <span>🔌</span> Diagnóstico de Fusibles
              </h2>
              
              <div class="space-y-3 max-h-[400px] overflow-y-auto pr-1">
                ${fusiblesCambiados.length === 0 ? `<p class="text-sm text-slate-500 italic">No se detectaron cambios de fusibles en esta vista.</p>` : 
                  fusiblesCambiados.map(f => `
                  <div class="border border-slate-100 rounded-2xl p-3 bg-slate-50">
                    <div class="flex justify-between items-center mb-2">
                      <span class="font-bold text-sm text-slate-800">Inc. #${f.id}</span>
                      <span class="text-xs font-bold bg-slate-200 px-2 py-1 rounded-md">SET ${f.nroSet || '?'}</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 text-xs mb-2">
                      <div class="bg-white p-2 rounded-lg border">
                        <span class="text-slate-400 block">Colocado</span>
                        <span class="font-bold text-lg">${f.fusibleColocado}A</span>
                      </div>
                      <div class="bg-white p-2 rounded-lg border">
                        <span class="text-slate-400 block">Teórico (ideal)</span>
                        <span class="font-bold text-lg">${f.fusibleIdeal ? f.fusibleIdeal + 'A' : '-'}</span>
                      </div>
                    </div>
                    
                    ${f.potenciaSet ? `<p class="text-[11px] text-slate-500 mb-2 text-center">Trafo: ${f.potenciaSet}kVA</p>` : ''}
                    
                    <div class="w-full text-center text-xs font-bold py-1.5 rounded-lg border ${f.evalFusible.cls}">
                      ${f.evalFusible.msg}
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>

            <div class="bg-white rounded-3xl p-5 shadow border border-slate-200">
              <h2 class="font-bold text-slate-900 text-lg mb-1 flex items-center gap-2">
                <span>🏢</span> SETs Afectadas (Agrupadas)
              </h2>
              <p class="text-xs text-slate-500 mb-4">Total de reclamos activos por SET y clientes en riesgo.</p>

              <div class="space-y-2 max-h-[400px] overflow-y-auto pr-1">
                ${topSets.length === 0 ? `<p class="text-sm text-slate-500 italic">No hay SETs identificadas.</p>` : 
                  topSets.map(([set, data]) => `
                  <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-2 last:border-0">
                    <div>
                      <div class="font-bold text-slate-800 text-sm">SET ${set}</div>
                      <div class="text-[10px] text-slate-500">Incidentes: ${data.ids.join(", ")}</div>
                    </div>
                    <div class="text-right flex items-center gap-3">
                      <div class="text-center">
                        <span class="block text-[10px] text-slate-400 uppercase">Reclamos</span>
                        <span class="font-bold text-red-500 bg-red-50 px-2 py-0.5 rounded">${data.count}</span>
                      </div>
                      <div class="text-center">
                        <span class="block text-[10px] text-slate-400 uppercase">Cl. en Riesgo</span>
                        <span class="font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded">${data.clientesRiesgo > 0 ? data.clientesRiesgo : '-'}</span>
                      </div>
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>

          </div>
        </div>
      `;
    }

    function toggleDetalle(id) {
      incidenteAbierto = incidenteAbierto === id ? null : id;
      render();
    }

    // Inicialización: Primero cargamos el Excel, luego consultamos los datos
    render();
    cargarBaseExcel();
  </script>
</body>
</html>
